# Contrôle qualité à chaque poussée — types, lint, tests.
#
# POURQUOI : jusqu'au 01/08/2026, RIEN n'empêchait de déployer une branche
# cassée. Le dépôt porte pourtant 1832 tests unitaires sur une logique métier
# volontairement pure (`lib/`) : ils tournaient à la main, donc parfois pas du
# tout. Vercel, lui, ne lance ni `tsc --noEmit` ni Vitest — un `next build`
# passe avec des erreurs de types dans du code non atteint par le build.
#
# CE QUI EST VÉRIFIÉ, dans l'ordre du moins cher au plus cher :
#   1. tsc --noEmit  — les types de tout le dépôt ;
#   2. eslint        — les règles du projet ;
#   3. vitest run    — la logique métier ;
#   4. next build    — le build de production (attrape ce que les trois autres
#                      ne voient pas : imports serveur/client, routes).
#
# Le build reçoit des variables Supabase FACTICES : aucune requête n'est faite
# au build (toutes les pages sensibles sont en `dynamic = 'force-dynamic'`),
# mais les clients Supabase exigent des valeurs non vides à l'instanciation.
# Aucun secret n'est donc nécessaire pour que cette CI tourne — y compris sur
# un fork.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Une seule exécution par branche : une poussée annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Types · lint · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Types (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Tests unitaires (vitest)
        run: npm test

      - name: Build de production (next build)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-anon-factice-pour-le-build
        run: npm run build

  contenu:
    name: Contenu scolaire (scripts/contenu)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Le générateur REFUSE de produire du SQL si une leçon est trop courte,
      # sans section `##` (carte mentale non dérivable), si un chapitre a moins
      # de 6 questions, si une question est mal formée ou si deux chapitres
      # portent le même titre au même niveau. Le faire tourner ici, c'est
      # valider tout le contenu à chaque poussée — sans base de données.
      - name: Valider le contenu et vérifier que le SQL est à jour
        run: |
          npm run contenu
          git diff --exit-code --stat supabase/ \
            || (echo "::error::Le SQL de contenu n'est pas à jour : lance 'npm run contenu' et commite le résultat." && exit 1)
